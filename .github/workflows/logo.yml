name: Logo (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pillow
          curl -fsSL https://i.imgur.com/ckrwhZ1.png -o docs/logo-white.png
          python3 -c "
          from PIL import Image
          im=Image.open('docs/logo-white.png').convert('RGBA')
          px=[(0,0,0,a) for r,g,b,a in im.getdata()]
          im.putdata(px); im.save('docs/logo-black.png')"
          git config user.name github-actions && git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/logo-white.png docs/logo-black.png && git commit -m "README logo files [skip ci]" && git push
